SYMBOLS {
    __STARTUP__:   type = import;
    # Frame scratch buffers are static; reserve 1 KiB for the cc65 stack.
    __STACKSIZE__: type = weak, value = $0400;
}
MEMORY {
    ZP:  file = "", define = yes, start = $0000,        size = $0080;
    RAM: file = %O, define = yes, start = $0300,        size = $BD00 - __STACKSIZE__;
    BSS: file = "",               start = __ONCE_RUN__, size = $C000 - __STACKSIZE__ - __ONCE_RUN__;
    REF: file = "%O.rom", start = $C000, size = $1000, fill = yes;
    MUSIC: file = "%O.music", start = $C000, size = $0B00;
    # Reserve the entire $FE00 page for CPB, followed by $FF00 I/O.
    SPLASH: file = "%O.splash", start = $D000, size = $2E00;
    # Screen-only overlay, loaded after argv parsing and reused by terrain.
    INTRO: file = "%O.intro", start = _reset_tiles, size = $0200, fill = yes;
    INTRO_PLAYER: file = "%O.intro", start = _sprites, size = $0400, fill = yes;
    INTRO_SCORE: file = "%O.intro", start = $F900, size = $0700;
    GAMEOVER: file = "%O.gameover", start = __STARTUP_AUDIO_RUN__, size = __STARTUP_AUDIO_SIZE__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    STARTUP:  load = RAM, type = ro;
    LOWCODE:  load = RAM, type = ro,  optional = yes;
    CODE:     load = RAM, type = ro;
    STARTUP_AUDIO: load = RAM, type = rw, define = yes;
    RODATA:   load = RAM, type = ro;
    DATA:     load = RAM, type = rw;
    INIT:     load = RAM, type = rw,  optional = yes;
    ONCE:     load = RAM, type = ro,  define   = yes;
    BSS:      load = BSS, type = bss, define   = yes;
    RR_ROM:   load = REF, type = ro, align = $100;
    MUSIC:    load = MUSIC, type = rw;
    SPLASH:   load = SPLASH, type = rw;
    INTRO:    load = INTRO, type = rw;
    INTRO_PLAYER: load = INTRO_PLAYER, type = rw;
    INTRO_SCORE: load = INTRO_SCORE, type = ro, define = yes;
    GAMEOVER: load = GAMEOVER, type = rw, define = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
